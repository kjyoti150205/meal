<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login - Hostel Meal Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/manager-auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="mgr-auth-page">
    <a href="index.html" class="mgr-btn mgr-btn-outline" style="position: absolute; top: 20px; left: 20px;">
        <i class="fas fa-home"></i> Home
    </a>
    <div class="mgr-auth-container">
        <div class="mgr-auth-card">
            <div class="mgr-auth-header">
                <h2><i class="fas fa-user-shield"></i> Manager Login</h2>
                <p>Access the manager dashboard to oversee hostel meals</p>
            </div>

            <form id="loginForm" class="mgr-auth-form" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" class="mgr-input" required placeholder="manager@hostel.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="mgr-password-wrap">
                        <input type="password" id="password" class="mgr-input" required placeholder="Enter password" autocomplete="current-password">
                        <button type="button" class="mgr-password-toggle" onclick="togglePassword('password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="mgr-auth-submit">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <a href="reset_password.html?role=manager" class="forgot-password">
                Forgot Password?
            </a>
            <div id="status" class="mgr-auth-status"></div>
            <div class="mgr-auth-links">
                Don't have an account? <a href="manager_register.html">Register here</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon  = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className   = `mgr-auth-status ${type}`;
        }

        async function handleLogin(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const email     = document.getElementById('email').value.trim();
            const password  = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                const response = await fetch(`${API_BASE}/api/manager/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    const statusType = response.status === 403 ? 'warning' : 'error';
                    showStatus(data.message || 'Login failed', statusType);
                    return false;
                }

                localStorage.setItem('managerToken', data.token);
                localStorage.setItem('manager', JSON.stringify(data.manager));

                showStatus('Login successful! Redirecting...', 'success');
                setTimeout(() => { window.location.href = 'manager_dashboard.html'; }, 800);
            } catch (error) {
                showStatus(error.message || 'Login failed. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
            return false;
        }

        if (localStorage.getItem('managerToken')) {
            window.location.href = 'manager_dashboard.html';
        }
    </script>
</body>
</html>
