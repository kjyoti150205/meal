<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Meal Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="public/css/responsive.css">
    <style>
        :root {
            --primary-color: #f32144;
            --text-color: #333;
            --bg-color: #f5f7fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .reset-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .reset-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .otp-inputs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            justify-content: center;
        }

        .otp-inputs input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 1.2rem;
            padding: 0;
        }

        .reset-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #d41b3f;
            transform: translateY(-2px);
        }

        .reset-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .links {
            text-align: center;
            margin-top: 1rem;
        }

        .links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        #error-message {
            color: #f44336;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        #success-message {
            color: #4CAF50;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .timer {
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        .timer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .timer a:hover {
            text-decoration: underline;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding-top: 2rem;
                padding-bottom: 2rem;
            }

            .reset-container {
                padding: 1.5rem 1.25rem;
                border-radius: 16px;
            }

            .reset-header h1 {
                font-size: 1.5rem;
            }

            input {
                font-size: 16px;
                min-height: 48px;
            }

            .reset-btn {
                min-height: 48px;
            }

            .otp-inputs {
                gap: 0.35rem;
                flex-wrap: wrap;
            }

            .otp-inputs input {
                width: 44px;
                height: 48px;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 380px) {
            .otp-inputs input {
                width: 40px;
                height: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1>Reset Password</h1>
            <p>Enter your email to reset your password</p>
        </div>

        <!-- Step 1: Email -->
        <div id="step1" class="step active">
            <form id="emailForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>
                <button type="submit" class="reset-btn" id="sendOtpBtn" onclick="sendOTP()">
                    Send OTP
                </button>
            </form>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="step2" class="step">
            <form id="otpForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Enter OTP</label>
                    <div class="otp-inputs">
                        <input type="text" maxlength="1" pattern="[0-9]" required>
                        <input type="text" maxlength="1" pattern="[0-9]" required>
                        <input type="text" maxlength="1" pattern="[0-9]" required>
                        <input type="text" maxlength="1" pattern="[0-9]" required>
                        <input type="text" maxlength="1" pattern="[0-9]" required>
                        <input type="text" maxlength="1" pattern="[0-9]" required>
                    </div>
                </div>
                <div class="timer" id="timer">Resend OTP in: 60s</div>
                <button type="submit" class="reset-btn" id="verifyOtpBtn" onclick="verifyOTP()">
                    Verify OTP
                </button>
            </form>
        </div>

        <!-- Step 3: New Password -->
        <div id="step3" class="step">
            <form id="passwordForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                <button type="submit" class="reset-btn" id="resetPasswordBtn" onclick="resetPassword()">
                    Reset Password
                </button>
            </form>
        </div>

        <div id="error-message"></div>
        <div id="success-message"></div>
        <div class="links">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script>
        // Point this at your Express backend if it isn't served from the same origin
        const API_BASE_URL = '';

        let countdown = 60;
        let timerInterval;
        let currentEmail = '';

        function showStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById(`step${stepNumber}`).classList.add('active');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function setButtonLoading(button, isLoading, defaultText) {
            button.disabled = isLoading;
            button.textContent = isLoading ? 'Please wait...' : defaultText;
        }

        function startTimer() {
            const timerDiv = document.getElementById('timer');
            countdown = 60;
            timerDiv.textContent = `Resend OTP in: ${countdown}s`;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                countdown--;
                timerDiv.textContent = `Resend OTP in: ${countdown}s`;

                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    timerDiv.innerHTML = `OTP expired. <a onclick="resendOTP()">Resend OTP</a>`;
                }
            }, 1000);
        }

        async function sendOTP() {
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showError('Please enter your email address');
                return;
            }

            const btn = document.getElementById('sendOtpBtn');
            setButtonLoading(btn, true, 'Send OTP');

            try {
                const response = await fetch(`${API_BASE_URL}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    showError(data.message || 'Email not registered');
                    return;
                }

                currentEmail = email;
                showStep(2);
                startTimer();
                showSuccess(data.message || 'OTP sent successfully to your email!');
                document.querySelector('.otp-inputs input').focus();
            } catch (error) {
                console.error('Error sending OTP:', error);
                showError('Failed to send OTP. Please try again.');
            } finally {
                setButtonLoading(btn, false, 'Send OTP');
            }
        }

        async function resendOTP() {
            if (!currentEmail) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    showError(data.message || 'Failed to resend OTP');
                    return;
                }

                startTimer();
                showSuccess(data.message || 'OTP resent successfully!');
            } catch (error) {
                console.error('Error resending OTP:', error);
                showError('Failed to resend OTP. Please try again.');
            }
        }

        async function verifyOTP() {
            const otpInputs = document.querySelectorAll('.otp-inputs input');
            const enteredOTP = Array.from(otpInputs).map(input => input.value).join('');

            if (enteredOTP.length !== 6) {
                showError('Please enter the complete 6-digit OTP');
                return;
            }

            const btn = document.getElementById('verifyOtpBtn');
            setButtonLoading(btn, true, 'Verify OTP');

            try {
                const response = await fetch(`${API_BASE_URL}/api/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp: enteredOTP })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    showError(data.message || 'Invalid OTP');
                    return;
                }

                clearInterval(timerInterval);
                showStep(3);
                showSuccess(data.message || 'OTP verified successfully!');
            } catch (error) {
                console.error('Error verifying OTP:', error);
                showError('Failed to verify OTP. Please try again.');
            } finally {
                setButtonLoading(btn, false, 'Verify OTP');
            }
        }

        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            const otpInputs = document.querySelectorAll('.otp-inputs input');
            const enteredOTP = Array.from(otpInputs).map(input => input.value).join('');

            const btn = document.getElementById('resetPasswordBtn');
            setButtonLoading(btn, true, 'Reset Password');

            try {
                const response = await fetch(`${API_BASE_URL}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentEmail,
                        otp: enteredOTP,
                        newPassword
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    showError(data.message || 'Failed to reset password');
                    return;
                }

                showSuccess(data.message || 'Password reset successful!');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                console.error('Error resetting password:', error);
                showError('Failed to reset password. Please try again.');
            } finally {
                setButtonLoading(btn, false, 'Reset Password');
            }
        }

        // Auto-focus next input in OTP fields
        document.querySelectorAll('.otp-inputs input').forEach((input, index) => {
            input.addEventListener('input', function(e) {
                // Only allow numbers
                this.value = this.value.replace(/[^0-9]/g, '');

                if (this.value.length === 1) {
                    const nextInput = document.querySelectorAll('.otp-inputs input')[index + 1];
                    if (nextInput) {
                        nextInput.focus();
                    }
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value) {
                    const prevInput = document.querySelectorAll('.otp-inputs input')[index - 1];
                    if (prevInput) {
                        prevInput.focus();
                    }
                }
            });

            // Handle paste event
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6);
                if (/^\d+$/.test(pastedData)) {
                    const inputs = document.querySelectorAll('.otp-inputs input');
                    pastedData.split('').forEach((digit, i) => {
                        if (inputs[i]) {
                            inputs[i].value = digit;
                        }
                    });
                    if (inputs[pastedData.length]) {
                        inputs[pastedData.length].focus();
                    }
                }
            });
        });
    </script>
</body>
</html>
