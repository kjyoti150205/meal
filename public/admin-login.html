<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Meal Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="container">
    <a href="/login.html" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Login
    </a>
    <div class="card">
      <div class="header">
        <h1><i class="fas fa-user-shield"></i> Admin Login</h1>
        <p>Confidential admin access only</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
          <div class="forgot-link">
            <a href="admin-forgot-password.html">Forgot Password?</a>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <!-- OTP PANEL — hidden until step 1 succeeds -->
      <div id="otpPanel" style="display:none;padding-top:8px;">
        <div style="text-align:center;margin-bottom:18px;">
          <div style="font-size:32px;margin-bottom:6px;">🔐</div>
          <h3 style="margin:0 0 4px;font-size:17px;">Enter Your OTP</h3>
          <p style="margin:0;font-size:13px;color:#6b7280;">
            A 6-digit code was sent to <strong id="otpEmailDisplay"></strong>
          </p>
        </div>
        <div class="form-group">
          <label for="otpInput">OTP Code</label>
          <input type="text" id="otpInput" maxlength="6" pattern="\d{6}"
                 placeholder="Enter 6-digit OTP"
                 style="letter-spacing:8px;font-size:20px;text-align:center;font-weight:700;width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;box-sizing:border-box;">
        </div>
        <button id="verifyOtpBtn" class="submit-btn" type="button" onclick="verifyLoginOtp()" style="width:100%;margin-bottom:10px;">
          <i class="fas fa-check-circle"></i> Verify OTP
        </button>
        <div style="text-align:center;margin-top:8px;">
          <button id="resendOtpBtn" type="button" onclick="resendLoginOtp()" disabled
                  style="background:none;border:none;color:#4f46e5;font-size:13px;cursor:pointer;text-decoration:underline;">
            Resend OTP (<span id="resendTimer">30</span>s)
          </button>
        </div>
        <div style="text-align:center;margin-top:8px;">
          <a href="#" onclick="backToLogin()" style="font-size:13px;color:#6b7280;">
            ← Back to Login
          </a>
        </div>
      </div>

      <div id="status"></div>
    </div>
  </div>
  <script src="js/admin-login.js"></script>
</body>
</html>
