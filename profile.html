<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Meal Tracker</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root{
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --success:#10b981;
    --danger:#ef4444;
    --text:#1f2937;
    --muted:#6b7280;
    --bg:#f4f7fb;
    --white:#ffffff;
    --radius:18px;
    --shadow:0 15px 35px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(circle at top left,#dbeafe 0%,transparent 35%),
        radial-gradient(circle at bottom right,#ede9fe 0%,transparent 35%),
        #f8fafc;
    min-height:100vh;
    padding:35px 20px;
    color:var(--text);
}

.container{
    max-width:850px;
    margin:auto;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;

    padding:22px 28px;
    margin-bottom:30px;

    background:rgba(255,255,255,.92);
    backdrop-filter:blur(15px);

    border-radius:20px;
    box-shadow:var(--shadow);
}

.header h1{
    font-size:30px;
    color:var(--primary);
    font-weight:700;
}

/* BACK BUTTON */

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:12px 22px;

    border-radius:12px;

    background:linear-gradient(135deg,var(--primary),#7c3aed);

    color:#fff;
    text-decoration:none;
    font-weight:600;

    transition:.3s;
}

.back-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(79,70,229,.3);
}

/* CARD */

.profile-card{

    background:rgba(255,255,255,.94);

    backdrop-filter:blur(20px);

    padding:35px;

    border-radius:22px;

    box-shadow:var(--shadow);
}

/* PROFILE */

.profile-header{

    display:flex;
    align-items:center;
    gap:30px;
    flex-wrap:wrap;

    margin-bottom:35px;
}

.profile-pic{

    width:140px;
    height:140px;

    border-radius:50%;
    object-fit:cover;

    border:5px solid var(--primary);

    box-shadow:0 15px 30px rgba(79,70,229,.25);
}

.profile-info h2{

    font-size:28px;
    margin-bottom:8px;
}

.profile-info p{

    color:var(--muted);
}

/* FORM */

.form-group{

    margin-bottom:22px;
}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;
}

input{

    width:100%;

    padding:14px 18px;

    border:2px solid #e5e7eb;

    border-radius:12px;

    font-size:15px;

    transition:.3s;

    font-family:'Poppins',sans-serif;
}

input:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:0 0 0 4px rgba(79,70,229,.15);
}

/* SAVE BUTTON */

.save-btn{

    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    padding:14px 28px;

    border:none;

    border-radius:14px;

    background:linear-gradient(135deg,var(--primary),#7c3aed);

    color:#fff;

    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

.save-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 15px 30px rgba(79,70,229,.3);
}

/* STATUS */

#status{

    display:none;

    margin-top:20px;

    padding:16px;

    border-radius:12px;

    font-weight:600;

    text-align:center;
}

#status.success{

    display:block;

    background:#ecfdf5;

    color:var(--success);
}

#status.error{

    display:block;

    background:#fef2f2;

    color:var(--danger);
}

/* PHOTO UPLOAD */

.upload-pic{

    margin-top:18px;

    text-align:center;
}

.upload-pic input{

    display:none;
}

.upload-btn{

    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:12px 22px;

    border-radius:12px;

    background:linear-gradient(135deg,#10b981,#059669);

    color:#fff;

    cursor:pointer;

    font-weight:600;

    transition:.3s;
}

.upload-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 12px 25px rgba(16,185,129,.3);
}

/* RESPONSIVE */

@media(max-width:768px){

.header{

    text-align:center;

    justify-content:center;
}

.profile-header{

    flex-direction:column;

    text-align:center;
}

.save-btn,
.back-btn{

    width:100%;
}
}
   </style>
</head>
<body>
    <div class="container">

    <div class="header">
        <h1>Profile Settings</h1>

        <a href="user_dashboard.html" class="back-btn" id="backLink">
            <i class="fas fa-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

    <div class="profile-card">

        <!-- Profile Header -->
        <div class="profile-header">

            <img
                src="images/default-profile.png"
                alt="Profile Picture"
                class="profile-pic"
                id="profilePic">

            <div class="profile-info">
                <h2 id="userName">Loading...</h2>
                <p id="userEmail">Loading...</p>
            </div>

        </div>

        <!-- Profile Form -->
        <form id="profileForm" enctype="multipart/form-data">

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>
            </div>

            <!-- Department / Designation -->
            <div class="form-group" id="deptGroup">
                <label for="department">Department</label>
                <input
                    type="text"
                    id="department"
                    placeholder="Enter department">
            </div>

            <!-- Room Number -->
            <div class="form-group" id="roomGroup">
                <label for="roomNumber">Room Number</label>
                <input
                    type="text"
                    id="roomNumber"
                    placeholder="Enter room number">
            </div>

            <!-- Institute ID -->
            <div class="form-group" id="instituteGroup">
                <label for="instituteId">Institute ID</label>
                <input
                    type="text"
                    id="instituteId"
                    placeholder="Enter institute ID">
            </div>

            <!-- Phone -->
            <div class="form-group" id="phoneGroup" style="display:none;">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number">
            </div>

            <!-- Hostel -->
            <div class="form-group" id="hostelGroup" style="display:none;">
                <label for="hostelName">Hostel Name</label>
                <input
                    type="text"
                    id="hostelName"
                    placeholder="Enter hostel name">
            </div>

            <!-- Profile Picture -->
            <div class="upload-pic">

                <label for="photoUpload" class="upload-btn">
                    <i class="fas fa-camera"></i>
                    Change Profile Picture
                </label>

                <input
                    type="file"
                    id="photoUpload"
                    accept="image/png,image/jpeg,image/jpg"
                    hidden>

            </div>

            <!-- Save Button -->
            <div style="margin-top:25px;">
                <button type="submit" class="save-btn" id="saveBtn">
                    <i class="fas fa-save"></i>
                    Save Changes
                </button>
            </div>

        </form>

        <!-- Status -->
        <div id="status"></div>

    </div>

</div>

<script>

// =======================================
// Profile Manager - Part 1
// Initialization & Profile Loading
// =======================================

const API = window.location.origin;

// Detect User / Manager
const isManager =
    new URLSearchParams(window.location.search).get("role") === "manager";

const managerToken = localStorage.getItem("managerToken");
const userToken = localStorage.getItem("userToken");

const account = isManager
    ? JSON.parse(localStorage.getItem("manager") || "null")
    : JSON.parse(localStorage.getItem("user") || "null");

// ---------------------------
// Authentication
// ---------------------------

if (!account) {

    alert("Please login first.");

    window.location.href = isManager
        ? "manager_login.html"
        : "login.html";

}

// ---------------------------
// DOM Elements
// ---------------------------

const profileForm = document.getElementById("profileForm");

const profilePic = document.getElementById("profilePic");

const photoUpload = document.getElementById("photoUpload");

const saveBtn = document.getElementById("saveBtn");

const statusBox = document.getElementById("status");

const userName = document.getElementById("userName");

const userEmail = document.getElementById("userEmail");

const fullName = document.getElementById("fullName");

const department = document.getElementById("department");

const roomNumber = document.getElementById("roomNumber");

const instituteId = document.getElementById("instituteId");

const phone = document.getElementById("phone");

const hostelName = document.getElementById("hostelName");

// ---------------------------
// Initialize Page
// ---------------------------

document.addEventListener("DOMContentLoaded", () => {

    setupProfile();

    profileForm.addEventListener("submit", updateProfile);

    photoUpload.addEventListener("change", handlePhotoUpload);

});

// ---------------------------
// Load Profile
// ---------------------------

function setupProfile() {

    if (isManager) {

        document.querySelector(".header h1").textContent =
            "Manager Profile";

        document.getElementById("backLink").href =
            "manager_dashboard.html";

        document.querySelector("#deptGroup label").textContent =
            "Designation";

        document.getElementById("roomGroup").style.display = "none";

        document.getElementById("instituteGroup").style.display = "none";

        document.getElementById("phoneGroup").style.display = "block";

        document.getElementById("hostelGroup").style.display = "block";

    }

    userName.textContent = account.fullName || "";

    userEmail.textContent = account.email || "";

    fullName.value = account.fullName || "";

    if (isManager) {

        department.value = account.designation || "";

        phone.value = account.phone || "";

        hostelName.value = account.hostelName || "";

    } else {

        department.value = account.department || "";

        roomNumber.value = account.roomNumber || "";

        instituteId.value = account.instituteId || "";

    }

    if (account.photoUrl) {

        profilePic.src = account.photoUrl.startsWith("http")
            ? account.photoUrl
            : API + account.photoUrl;

    }

}// =======================================
// Profile Manager - Part 2
// Upload & Update Profile
// =======================================

// ---------------------------
// Upload Profile Picture
// ---------------------------

async function handlePhotoUpload(event) {

    const file = event.target.files[0];

    if (!file) return;

    const formData = new FormData();

    formData.append("photo", file);

    if (!isManager) {
        formData.append("fullName", account.fullName);
    }

    try {

        saveBtn.disabled = true;
        saveBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Uploading...';

        const url = isManager
    ? `${API}/api/manager/profile`
    : `${API}/api/users/${account._id}`;

const response = await fetch(url, {
    method: "PUT",
    headers: {
        Authorization: `Bearer ${isManager ? managerToken : userToken}`
    },
    body: formData
});

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Upload Failed");
        }

        const updated = isManager ? data.manager : data.user;

        localStorage.setItem(
            isManager ? "manager" : "user",
            JSON.stringify(updated)
        );

        if (updated.photoUrl) {

            profilePic.src = updated.photoUrl.startsWith("http")
                ? updated.photoUrl
                : API + updated.photoUrl;

        }

        showStatus(
            "Profile picture updated successfully.",
            "success"
        );

    } catch (err) {

        console.error(err);

        showStatus(
            err.message || "Photo upload failed.",
            "error"
        );

    } finally {

        saveBtn.disabled = false;

        saveBtn.innerHTML =
            '<i class="fas fa-save"></i> Save Changes';

    }

}

// ---------------------------
// Update Profile
// ---------------------------

async function updateProfile(event) {

    event.preventDefault();

    const formData = new FormData();

    formData.append(
        "fullName",
        fullName.value.trim()
    );

    if (isManager) {

        formData.append(
            "designation",
            department.value.trim()
        );

        formData.append(
            "phone",
            phone.value.trim()
        );

        formData.append(
            "hostelName",
            hostelName.value.trim()
        );

    } else {

        formData.append(
            "department",
            department.value.trim()
        );

        formData.append(
            "roomNumber",
            roomNumber.value.trim()
        );

        formData.append(
            "instituteId",
            instituteId.value.trim()
        );

    }

    const photo = photoUpload.files[0];

    if (photo) {

        formData.append("photo", photo);

    }

    try {

        saveBtn.disabled = true;

        saveBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Saving...';

        const url = isManager
            ? `${API}/api/manager/profile`
            : `${API}/api/users/${account._id}/profile`;

        const response = await fetch(url, {

            method: isManager ? "PUT" : "POST",

            headers: {
                Authorization: `Bearer ${isManager ? managerToken : userToken}`
            },

            body: formData

        });

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message || "Profile update failed."
            );

        }

        const updated = isManager
            ? data.manager
            : data.user;

        localStorage.setItem(
            isManager ? "manager" : "user",
            JSON.stringify(updated)
        );

        userName.textContent =
            updated.fullName;

        if (updated.photoUrl) {

            profilePic.src =
                updated.photoUrl.startsWith("http")
                    ? updated.photoUrl
                    : API + updated.photoUrl;

        }

        showStatus(
            "Profile updated successfully.",
            "success"
        );

    } catch (err) {

        console.error(err);

        showStatus(
            err.message || "Unable to update profile.",
            "error"
        );

    } finally {

        saveBtn.disabled = false;

        saveBtn.innerHTML =
            '<i class="fas fa-save"></i> Save Changes';

    }

}// =======================================
// Profile Manager - Part 3
// Helpers & Utilities
// =======================================

// ---------------------------
// Status Message
// ---------------------------

function showStatus(message, type = "success") {

    statusBox.className = "";

    statusBox.classList.add(type);

    statusBox.style.display = "block";

    statusBox.innerHTML = message;

    setTimeout(() => {

        statusBox.style.display = "none";

    }, 3000);

}


// ---------------------------
// Image Preview
// ---------------------------

photoUpload.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

        showStatus("Please select a valid image.", "error");

        this.value = "";

        return;

    }

    if (file.size > 5 * 1024 * 1024) {

        showStatus("Image size must be below 5 MB.", "error");

        this.value = "";

        return;

    }

    const reader = new FileReader();

    reader.onload = function (e) {

        profilePic.src = e.target.result;

    };

    reader.readAsDataURL(file);

});


// ---------------------------
// Input Validation
// ---------------------------

fullName.addEventListener("input", () => {

    fullName.value = fullName.value.replace(/\s+/g, " ");

});

if (!isManager && instituteId) {

    instituteId.addEventListener("input", () => {

        instituteId.value =
            instituteId.value.replace(/\D/g, "");

    });

}


// ---------------------------
// Refresh Profile
// ---------------------------

function refreshProfile(updated) {

    userName.textContent = updated.fullName || "";

    userEmail.textContent = updated.email || "";

    fullName.value = updated.fullName || "";

    if (isManager) {

        department.value = updated.designation || "";

        phone.value = updated.phone || "";

        hostelName.value = updated.hostelName || "";

    } else {

        department.value = updated.department || "";

        roomNumber.value = updated.roomNumber || "";

        instituteId.value = updated.instituteId || "";

    }

    if (updated.photoUrl) {

        profilePic.src = updated.photoUrl.startsWith("http")

            ? updated.photoUrl

            : API + updated.photoUrl;

    }

}


// ---------------------------
// Window Load Animation
// ---------------------------

window.addEventListener("load", () => {

    document.querySelector(".profile-card").style.opacity = "0";

    document.querySelector(".profile-card").style.transform =
        "translateY(20px)";

    setTimeout(() => {

        document.querySelector(".profile-card").style.transition =
            ".4s ease";

        document.querySelector(".profile-card").style.opacity = "1";

        document.querySelector(".profile-card").style.transform =
            "translateY(0px)";

    }, 100);

});


// ---------------------------
// Debug Mode
// ---------------------------

console.log("========== PROFILE ==========");

console.log("Role :", isManager ? "Manager" : "User");

console.log("Logged User :", account);

console.log("API :", API);

console.log("=============================");

</script>
</body>
</html>
